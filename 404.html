<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script>
    (function() {
      var savedTheme = localStorage.getItem('portfolio-theme') || 'dark';
      document.documentElement.setAttribute('data-theme', savedTheme);
    })();
  </script>
  <title>404 — Page Not Found | Arpan Dutta</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link rel="stylesheet" href="./assets/css/style.css">
  <style>
    .error-wrapper {
      min-height: 80vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px 20px;
    }
    .error-code {
      font-size: clamp(5rem, 15vw, 9rem);
      font-weight: 900;
      line-height: 1;
      font-family: var(--font-mono);
      background: linear-gradient(135deg, var(--accent-primary) 0%, var(--accent-hover) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 16px;
    }
    .error-title {
      font-size: clamp(1.5rem, 3vw, 2.2rem);
      font-weight: 800;
      color: var(--text-primary);
      margin-bottom: 12px;
    }
    .error-desc {
      font-size: 1.1rem;
      color: var(--text-muted);
      max-width: 500px;
      margin: 0 auto 32px auto;
    }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="nav-container">
      <a href="./index.html" class="brand-logo" aria-label="Arpan Dutta Portfolio Home">
        <span>Arpan Dutta</span>
        <span class="brand-tag">&lt;dev /&gt;</span>
      </a>
      <div class="nav-controls">
        <button id="theme-toggle" class="theme-toggle-btn" type="button" aria-label="Toggle Theme" title="Toggle Theme">
          <i class="fa-solid fa-moon" id="theme-icon"></i>
        </button>
      </div>
    </div>
  </header>

  <main class="error-wrapper">
    <div class="container">
      <div class="error-code">404</div>
      <h1 class="error-title">Page Not Found</h1>
      <p class="error-desc">
        The page you are looking for might have been removed, had its name changed, or is temporarily unavailable.
      </p>
      <div class="btn-group" style="justify-content: center;">
        <a href="./index.html" class="btn btn-primary">
          <i class="fa-solid fa-house"></i> Return to Portfolio
        </a>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <div class="footer-content" style="justify-content: center;">
        <p>© 2025–2026 <strong>Arpan Dutta</strong>. Built with HTML5, CSS3 & JavaScript.</p>
      </div>
    </div>
  </footer>

  <script src="./assets/js/main.js"></script>
</body>
</html>
